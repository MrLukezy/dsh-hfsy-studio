# dsh-hfsy-studio bundle patch：把「生图工作台」插进 dsh Web bundle。
# 这里的 config 就是工作台的默认参数，改完保存并重载插件即可生效。
- insert:
    - id: hfsy-studio
      name: dsh-hfsy-studio
      config:
        # hfsy 中转的 OpenAI 兼容根地址（末尾不要带 /）
        baseUrl: https://www.hfsyapi.cn/v1
        # 从这里取密钥：DSH 凭据库里的名字，取不到时回落到同名环境变量
        apiKeyEnv: OPENAI_API_KEY
        # 出图/出片落盘目录；相对路径按 dsh 进程工作目录解析
        outputDir: D:/lukezy/deepseek_harness/chat/hfsy-output
        imageModels:
          - gpt-image-2
          - gpt-image-2.5
          - gpt-image-2.6
          - gpt-image-2pro
          - gpt-image-2pro-4k
        # 走 /video/create + /video/query 的按秒计费模型（价格见页面上标价）
        videoModels:
          - sd-2-fast-480
          - sd-2-fast-720
          - sd-2.5-480
          - sd-2.5-720
          - wan-3.0-480
          - wan-3.0-720
          - minimax-h3
        maxConcurrent: 2
        # 价目表缓存时间（毫秒），页面「刷新」会强制重拉
        pricingTtlMs: 600000
        # 中转 /api/pricing 里的金额单位符号
        currencySymbol: $
        # 单次最多带几张参考图（角色 / 图生图）
        maxRefs: 4
        # 工具库「4K 增强」可用的模型
        upscaleModels:
          - gpt-image-2pro-4k
          - gpt-image-2pro